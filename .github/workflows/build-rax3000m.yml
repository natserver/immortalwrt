name: Build RAX3000M (eMMC) + daed

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'config/**'
      - 'scripts/**'
      - '.github/workflows/build-rax3000m.yml'

permissions:
  contents: write

env:
  SRC_URL: https://github.com/immortalwrt/immortalwrt.git
  SRC_TAG: v25.12.2
  SEED_CONFIG: config/rax3000m-emmc-daed.config
  DIY_PART1: scripts/diy-part1.sh
  DIY_PART2: scripts/diy-part2.sh
  TZ: Asia/Shanghai

jobs:
  build:
    name: 编译固件
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 释放磁盘空间
        run: |
          sudo rm -rf \
            /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache /usr/local/share/boost \
            /usr/local/graalvm /usr/local/share/powershell \
            /usr/local/share/chromium /usr/local/lib/node_modules \
            /opt/az /usr/share/swift /usr/local/swift \
            /usr/share/miniconda /usr/local/.ghcup || true
          sudo docker image prune -af || true
          sudo apt-get clean || true
          df -h /

      - name: 创建交换分区
        continue-on-error: true
        run: |
          set +e
          SWAPFILE=/mnt/openwrt-swap
          sudo rm -f "$SWAPFILE"
          sudo fallocate -l 8G "$SWAPFILE" || sudo dd if=/dev/zero of="$SWAPFILE" bs=1M count=8192
          sudo chmod 600 "$SWAPFILE"
          sudo mkswap "$SWAPFILE" > /dev/null
          sudo swapon "$SWAPFILE"
          free -h
          exit 0

      - name: 安装编译依赖
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential clang lld llvm llvm-dev \
            flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git file patch cpio bzip2 zip unzip wget curl rsync time \
            libncurses-dev libssl-dev zlib1g-dev libbz2-dev libzstd-dev \
            libelf-dev libltdl-dev libmpfr-dev libmpc-dev libgmp-dev \
            libacl1-dev libattr1-dev libfuse-dev libreadline-dev \
            autoconf automake libtool libtool-bin pkgconf quilt asciidoc \
            cmake ninja-build gperf intltool help2man docbook-xsl \
            device-tree-compiler swig xxd ccache zstd \
            python3 python3-ply python3-setuptools python3-docutils \
            python3-dev python3-pip python3-yaml \
            qemu-utils squashfs-tools texinfo yasm \
            subversion gettext-base
          sudo apt-get clean
          for d in /usr/lib/llvm-*/bin; do
            [ -d "$d" ] && echo "$d" >> "$GITHUB_PATH"
          done
          clang --version
          df -h /

      - name: 拉取 ImmortalWrt ${{ env.SRC_TAG }}
        run: |
          git clone --depth 1 --branch "$SRC_TAG" "$SRC_URL" openwrt
          git -C openwrt log -1 --oneline

      - name: diy-part1（追加 daed 源）
        run: |
          chmod +x "$DIY_PART1"
          cd openwrt
          ../"$DIY_PART1"

      - name: 更新并安装 feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: diy-part2（定制与校验）
        run: |
          chmod +x "$DIY_PART2"
          cd openwrt
          ../"$DIY_PART2"

      - name: 生成 .config 并校验关键选项
        run: |
          cd openwrt
          cp "../$SEED_CONFIG" .config
          make defconfig

          fail=0
          check() {
            if grep -qE "$1" .config; then
              echo "  OK   $1"
            else
              echo "  FAIL $1"
              fail=1
            fi
          }
          echo "===== 关键选项校验 ====="
          check '^CONFIG_TARGET_mediatek_filogic_DEVICE_cmcc_rax3000m=y$'
          check '^CONFIG_TARGET_ROOTFS_PARTSIZE=8192$'
          check '^CONFIG_VERSION_DIST="NatserverWrt"$'
          check '^CONFIG_IMAGEOPT=y$'
          check '^CONFIG_VERSIONOPT=y$'
          check '^CONFIG_DEVEL=y$'
          check '^CONFIG_BPF_TOOLCHAIN_HOST=y$'
          check '^CONFIG_KERNEL_DEBUG_INFO=y$'
          check '^CONFIG_KERNEL_DEBUG_INFO_BTF=y$'
          check '^CONFIG_KERNEL_BPF_EVENTS=y$'
          check '^CONFIG_KERNEL_XDP_SOCKETS=y$'
          check '^CONFIG_KERNEL_CGROUP_BPF=y$'
          check '^CONFIG_PACKAGE_dae=y$'
          check '^CONFIG_PACKAGE_daed=y$'
          check '^CONFIG_PACKAGE_luci-app-daede=y$'
          check '^CONFIG_PACKAGE_luci-app-daed=y$'
          check '^CONFIG_PACKAGE_vmlinux-btf=m$'
          check '^CONFIG_PACKAGE_kmod-sched-core=y$'
          check '^CONFIG_PACKAGE_kmod-sched-bpf=y$'
          check '^CONFIG_PACKAGE_kmod-veth=y$'
          check '^CONFIG_PACKAGE_v2ray-geoip=y$'
          check '^CONFIG_PACKAGE_v2ray-geosite=y$'
          check '^CONFIG_PACKAGE_daed-geoip=y$'
          check '^CONFIG_PACKAGE_daed-geosite=y$'

          # ---- iStoreOS 应用商店（iStore）----
          # 常见坑：taskd 的依赖链里 script-utils / coreutils-stty 名字很怪，
          # 一旦有一个不满足，defconfig 会把 taskd、luci-lib-taskd、luci-app-store
          # 整条链【静默丢弃】，编出来的固件「应用商店菜单直接没有」。
          check '^CONFIG_PACKAGE_luci-app-store=y$'
          check '^CONFIG_PACKAGE_taskd=y$'
          check '^CONFIG_PACKAGE_luci-lib-taskd=y$'
          check '^CONFIG_PACKAGE_luci-lib-xterm=y$'
          check '^CONFIG_PACKAGE_luci-compat=y$'
          check '^CONFIG_PACKAGE_script-utils=y$'
          check '^CONFIG_PACKAGE_coreutils=y$'
          check '^CONFIG_PACKAGE_coreutils-stty=y$'
          check '^CONFIG_PACKAGE_mount-utils=y$'

          # ---- iStoreOS 外观（Argon 主题）与中文界面 ----
          check '^CONFIG_PACKAGE_luci-theme-argon=y$'
          check '^CONFIG_PACKAGE_luci-app-argon-config=y$'
          check '^CONFIG_LUCI_LANG_zh_Hans=y$'
          check '^CONFIG_PACKAGE_luci-i18n-base-zh-cn=y$'
          check '^CONFIG_PACKAGE_luci-i18n-argon-config-zh-cn=y$'

          if grep -qE '^CONFIG_KERNEL_DEBUG_INFO_REDUCED=y$' .config; then
            echo "  FAIL CONFIG_KERNEL_DEBUG_INFO_REDUCED 必须关闭，否则内核 BTF 不会生成"
            fail=1
          else
            echo "  OK   CONFIG_KERNEL_DEBUG_INFO_REDUCED is not set"
          fi

          [ "$fail" -eq 0 ] || { echo "::error::配置校验失败，终止构建"; exit 1; }

      - name: 下载源码包
        run: |
          cd openwrt
          if ! make download -j"$(nproc)" 2>&1 | tee ../download.log; then
            echo "::warning::第一次下载失败，清理不完整文件后重试"
            find dl -size -1024c -type f -delete 2>/dev/null || true
            make download -j"$(nproc)" 2>&1 | tee -a ../download.log || {
              echo "::error::源码下载失败"
              tail -n 300 ../download.log
              exit 1
            }
          fi

      - name: 编译固件
        run: |
          cd openwrt
          make -j"$(nproc)" 2>&1 | tee ../build.log || {
            echo "::error::编译失败，以下是最后 500 行日志"
            tail -n 500 ../build.log
            exit 1
          }

      - name: 收集产物
        run: |
          set -e
          SRC=openwrt/bin/targets/mediatek/filogic
          echo "===== $SRC ====="
          ls -lh "$SRC"

          mkdir -p firmware
          for f in "$SRC"/*; do
            b=$(basename "$f")
            case "$b" in
              *cmcc_rax3000m-emmc-*|*cmcc_rax3000m-squashfs-sysupgrade*|*cmcc_rax3000m-initramfs-recovery*|*cmcc_rax3000m.manifest|config.buildinfo)
                cp -v "$f" firmware/ ;;
            esac
          done

          echo "===== 产物 ====="
          ls -lh firmware

          sysu=$(ls firmware/*cmcc_rax3000m-squashfs-sysupgrade* 2>/dev/null | head -n1 || true)
          if [ -z "$sysu" ]; then
            echo "::error::没有找到 RAX3000M sysupgrade 固件"
            exit 1
          fi

          {
            echo "ImmortalWrt $SRC_TAG · CMCC RAX3000M (eMMC) · daed + iStoreOS 界面"
            echo "构建时间: $(date '+%F %T %Z')"
            echo ""
            echo "== 关键配置 =="
            grep -E '^(CONFIG_VERSION_DIST|CONFIG_TARGET_ROOTFS_PARTSIZE|CONFIG_TARGET_mediatek_filogic_DEVICE|CONFIG_BPF_TOOLCHAIN|CONFIG_KERNEL_DEBUG_INFO|CONFIG_PACKAGE_dae|CONFIG_PACKAGE_daed|CONFIG_PACKAGE_luci-app-daede|CONFIG_PACKAGE_vmlinux-btf)=' openwrt/.config || true
            echo ""
            echo "== 系统分区（解析 emmc-gpt.bin）=="
            python3 scripts/check-gpt.py "$SRC"/*cmcc_rax3000m-emmc-gpt.bin || true
            echo "  → overlay 可用空间 = production 分区 − FIT 镜像大小（fitblk 映射 /dev/fitrw）"
            echo ""
            echo "== 界面组件（iStoreOS 应用商店 + Argon 主题）=="
            grep -E '^(luci-app-store|taskd|luci-lib-taskd|luci-lib-xterm|luci-compat|script-utils|coreutils-stty|luci-theme-argon|luci-app-argon-config|luci-i18n-base-zh-cn|luci-i18n-argon-config-zh-cn) ' "$SRC"/*cmcc_rax3000m.manifest || true
            echo ""
            echo "== 刷机说明（eMMC 版）=="
            echo "1. 先写 GPT / preloader / FIP（ImmortalWrt 官方刷机第 1~4 步）："
            echo "     dd if=<...>-emmc-gpt.bin of=/dev/mmcblk0 bs=512 seek=0 count=34 conv=fsync"
            echo "   ★ 系统分区 8G 完全由 emmc-gpt.bin 决定，sysupgrade 不会重写分区表；"
            echo "     只刷 sysupgrade 而不刷 GPT，分区仍是原厂大小（这就是「分区太小」的常见原因）。"
            echo "2. 进入 192.168.1.1 的 U-Boot 网页，刷入 sysupgrade.itb。"
            echo "3. 进系统后：默认 IP 192.168.100.1，主机名 NatserverWrt，"
            echo "   界面默认 Argon 主题 + 简体中文，左侧菜单含「iStore 应用商店」。"
            echo ""
            echo "== SHA256 =="
            (cd firmware && sha256sum * | sort)
          } > firmware/RELEASE_NOTES.txt
          cat firmware/RELEASE_NOTES.txt

      - name: 校验产物（8G 系统分区 + iStore/Argon 是否真的进了固件）
        run: |
          set -e
          SRC=openwrt/bin/targets/mediatek/filogic
          WORK=$(mktemp -d)

          echo "::group::1) 系统分区大小（解析 emmc-gpt.bin）"
          GPT=$(ls "$SRC"/*cmcc_rax3000m-emmc-gpt.bin 2>/dev/null | head -n1 || true)
          if [ -z "$GPT" ]; then
            echo "::error::找不到 emmc-gpt.bin，无法确认系统分区大小"
            exit 1
          fi
          # system partition 必须是 8192 MiB = 8 GiB，否则说明
          # CONFIG_TARGET_ROOTFS_PARTSIZE 没有传导到 ptgen。
          python3 scripts/check-gpt.py "$GPT" --expect production=8192 || exit 1
          echo "::endgroup::"

          echo "::group::2) 包清单（manifest）"
          MANIFEST=$(ls "$SRC"/*cmcc_rax3000m.manifest 2>/dev/null | head -n1 || true)
          if [ -z "$MANIFEST" ]; then
            echo "::error::找不到 manifest"
            exit 1
          fi
          # manifest 只证明「包被装了」，不证明「服务会自启」，两者都要查。
          FAIL=0
          for p in luci-app-store taskd luci-lib-taskd luci-lib-xterm luci-compat \
                   script-utils coreutils coreutils-stty \
                   luci-theme-argon luci-app-argon-config \
                   luci-i18n-base-zh-cn luci-i18n-argon-config-zh-cn; do
            if grep -q "^${p} " "$MANIFEST"; then
              echo "  ok      ${p}"
            else
              echo "  MISSING ${p}"
              FAIL=1
            fi
          done
          echo "::endgroup::"

          echo "::group::3) rootfs 关键文件"
          ITB=$(ls "$SRC"/*cmcc_rax3000m-squashfs-sysupgrade.itb 2>/dev/null | head -n1 || true)
          if [ -z "$ITB" ]; then
            echo "::error::找不到 sysupgrade.itb"
            exit 1
          fi
          # FIT 用的是 mkimage -E -r（external static rootfs），rootfs 以裸 squashfs
          # 形式落在镜像里，按魔数 'hsqs' 定位（别用 grep -P）。
          SQ=""
          for OFF in $(grep -abo 'hsqs' "$ITB" | cut -d: -f1 | head -n5); do
            tail -c +$((OFF + 1)) "$ITB" > "$WORK/cand.sqsh"
            if unsquashfs -s "$WORK/cand.sqsh" >/dev/null 2>&1; then
              echo "squashfs 偏移: $OFF"
              mv "$WORK/cand.sqsh" "$WORK/root.sqsh"
              SQ="$WORK/root.sqsh"
              break
            fi
          done
          if [ -z "$SQ" ]; then
            echo "::warning::未能从 itb 定位 squashfs，跳过 rootfs 内容校验"
          else
            # 只读目录表，绝不真正解包（解包 + 兜底重试会撞 File exists 把步骤搞挂）
            unsquashfs -l "$SQ" 2>/dev/null \
              | sed 's,^squashfs-root/*,,' | awk 'NF{print $1}' | sort -u > "$WORK/list"
            N=$(wc -l < "$WORK/list")
            echo "rootfs 条目: $N"
            if [ "$N" -lt 500 ]; then
              echo "::warning::清单读取不可靠($N)，跳过 rootfs 内容校验"
            else
              # 目录用前缀匹配，文件用整行匹配
              for d in www/luci-static/istore/ www/luci-static/argon/; do
                if grep -q "^${d}" "$WORK/list"; then
                  echo "  ok      /${d}"
                else
                  echo "  MISSING /${d}"
                  FAIL=1
                fi
              done
              # 这几个是「用户肉眼能看到的缺陷」，缺失一律硬失败：
              #   tasks             -> iStore 后端守护进程（不装应用商店打不开）
              #   cbi.lua           -> luci-compat，iStore 老式 CBI 页面依赖
              #   store.zh-cn.lmo   -> 应用商店中文
              #   99-natserver      -> 首次启动固化中文/主题/服务
              for f in etc/init.d/tasks \
                       usr/lib/lua/luci/cbi.lua \
                       etc/uci-defaults/99-natserver; do
                if grep -qxF "$f" "$WORK/list"; then
                  echo "  ok      /${f}"
                else
                  echo "  MISSING /${f}"
                  FAIL=1
                fi
              done
              if grep -qE '^usr/lib/lua/luci/i18n/store\.(zh-cn|zh_Hans)\.lmo$' "$WORK/list"; then
                grep -E '^usr/lib/lua/luci/i18n/store\.' "$WORK/list" | sed 's/^/  ok      \//'
              else
                echo "  MISSING /usr/lib/lua/luci/i18n/store.zh-cn.lmo（应用商店界面会退回英文）"
                FAIL=1
              fi
              grep '^usr/lib/lua/luci/i18n/' "$WORK/list" | sed 's/^/    /' || true
            fi
          fi
          echo "::endgroup::"

          if [ "$FAIL" -ne 0 ]; then
            echo "::error::产物缺少关键组件，刷机后界面/应用商店会有肉眼可见的缺陷"
            exit 1
          fi
          echo "产物校验通过：8G 系统分区 + iStore 应用商店 + Argon 主题"

      - name: 上传固件 (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-25.12.2-cmcc_rax3000m-emmc-daed
          path: firmware/
          if-no-files-found: error
          retention-days: 30

      - name: 发布 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="rax3000m-$(date '+%Y%m%d-%H%M')"
          gh release create "$TAG" firmware/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "ImmortalWrt $SRC_TAG · CMCC RAX3000M (eMMC) + daed" \
            --notes-file firmware/RELEASE_NOTES.txt \
            --latest || {
              echo "::warning::Release 创建失败，固件仍可从 Actions Artifact 下载"
            }
